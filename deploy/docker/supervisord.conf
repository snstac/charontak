[supervisord]
nodaemon=true
loglevel=info
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; System D-Bus for cockpit-bridge / session integration (best-effort).
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=5
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PyTAK CoT bridge lanes (see /etc/charontak.ini).
[program:charontak]
command=/usr/local/bin/charontak --config /etc/charontak.ini
priority=20
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Cockpit web UI (:9090). TLS should be terminated by a reverse proxy for production.
[program:cockpit-ws]
environment=COCKPIT_REMOTE_ANY="1"
command=/usr/lib/cockpit/cockpit-ws --no-tls --address=0.0.0.0 -p 9090
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
