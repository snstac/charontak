services:
  cotbridge:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${COTBRIDGE_IMAGE:-cotbridge:local}
    restart: unless-stopped
    ports:
      - "${COCKPIT_PORT:-9090}:9090"
    volumes:
      - ./cotbridge.override.ini:/etc/cotbridge.ini:ro
    profiles:
      - bridge

  cotbridge-host:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${COTBRIDGE_IMAGE:-cotbridge:local}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./cotbridge.override.ini:/etc/cotbridge.ini:ro
    profiles:
      - hostnet
