services:
  charontak:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${CHARONTAK_IMAGE:-charontak:local}
    restart: unless-stopped
    ports:
      - "${COCKPIT_PORT:-9090}:9090"
    volumes:
      - ./charontak.override.ini:/etc/charontak.ini:ro
    profiles:
      - bridge

  charontak-host:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${CHARONTAK_IMAGE:-charontak:local}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./charontak.override.ini:/etc/charontak.ini:ro
    profiles:
      - hostnet
