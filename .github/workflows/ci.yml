name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release with packages (use with tag checkout or push a tag)"
        type: boolean
        default: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Install package (editable)
        run: pip install -e ".[dev]"
      - name: Test with pytest
        run: pytest

  package-deb:
    name: Build Debian package
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-22.04
    env:
      DEB_BUILD_OPTIONS: nocheck
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian build dependencies
        run: sudo bash debian/install_pkg_build_deps.sh
      - name: Upgrade setuptools for stdeb (system setuptools may ignore pyproject.toml)
        run: python3 -m pip install --upgrade 'setuptools>=61' wheel
      - name: Build .deb
        run: make clean package
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-deb
          path: deb_dist/*.deb

  package-rpm:
    name: Build RPM package
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-22.04
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y git python3 python3-pip rpm-build python3-setuptools
      - uses: actions/checkout@v4
      - name: Upgrade setuptools
        run: python3 -m pip install --upgrade 'setuptools>=61' wheel
      - name: Build RPM
        run: python3 setup.py bdist_rpm --python=/usr/bin/python3
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-rpm
          path: dist/*.rpm

  release:
    name: Publish GitHub Release
    needs: [package-deb, package-rpm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: artifact-deb
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: artifact-rpm
          path: dist/
      - name: List packages
        run: ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
