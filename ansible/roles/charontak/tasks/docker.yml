---

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_pkg_mgr == "apt"

- name: Install Docker + Compose + git (apt)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-plugin
      - git
    state: present
  when: ansible_pkg_mgr == "apt"

- name: Enable Docker service (Debian/Ubuntu)
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- ansible.builtin.file:
    path: "{{ charontak_install_dir }}"
    state: directory
    mode: "0755"

- name: Clone Charontak (git)
  ansible.builtin.git:
    repo: "{{ charontak_git_repo }}"
    version: "{{ charontak_git_version }}"
    dest: "{{ charontak_repo_dir }}"
    force: true
  when: not charontak_sync_from_controller | bool

- name: Rsync workspace from Ansible controller into target
  ansible.posix.synchronize:
    src: "{{ charontak_sync_src | trim('/') }}/"
    dest: "{{ charontak_repo_dir }}/"
    delete: "{{ charontak_sync_delete | bool }}"
    rsync_opts:
      - "--exclude=.git/"
      - "--exclude=.venv/"
      - "--exclude=.cursor/"
  delegate_to: localhost
  when: charontak_sync_from_controller | bool

- name: Render Compose bind-mounted INI
  ansible.builtin.template:
    src: charontak.ini.j2
    dest: "{{ charontak_repo_dir }}/deploy/docker/charontak.override.ini"
    mode: "0644"
  notify: Restart Charontak docker stack

- name: Compose .env
  ansible.builtin.copy:
    dest: "{{ charontak_repo_dir }}/deploy/docker/.env"
    mode: "0600"
    content: |
      CHARONTAK_IMAGE={{ charontak_docker_image_override | default('charontak:ansible', true) }}
      COCKPIT_PORT={{ charontak_cockpit_port }}

- name: Install systemd unit for docker compose
  ansible.builtin.template:
    src: charontak-docker.service.j2
    dest: /etc/systemd/system/charontak-docker.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Charontak docker stack

- name: Enable docker stack unit
  ansible.builtin.systemd_service:
    name: charontak-docker
    enabled: true
    daemon_reload: true
    state: started

