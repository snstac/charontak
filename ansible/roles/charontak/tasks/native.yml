---

- ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_pkg_mgr == "apt"

- name: Debian/Ubuntu cockpit + Python
  ansible.builtin.apt:
    name:
      - cockpit-ws
      - cockpit-bridge
      - python3
      - python3-pip
      - ca-certificates
      - openssl
    state: present
  when: ansible_pkg_mgr == "apt"

- name: Fedora/RHEL cockpit (tune for AryaOS)
  ansible.builtin.package:
    name:
      - cockpit-system
      - cockpit-ws
      - cockpit-bridge
      - python3
      - python3-pip
    state: present
  when:
    - ansible_pkg_mgr == "dnf"
    - charontak_cockpit_rpm_optional | bool
  ignore_errors: true

- ansible.builtin.file:
    path: "{{ charontak_install_dir }}"
    state: directory
    mode: "0755"

- name: Clone Charontak
  ansible.builtin.git:
    repo: "{{ charontak_git_repo }}"
    version: "{{ charontak_git_version }}"
    dest: "{{ charontak_repo_dir }}"
    force: true
  when: not charontak_sync_from_controller | bool

- name: Sync Charontak from controller
  ansible.posix.synchronize:
    src: "{{ charontak_sync_src | trim('/') }}/"
    dest: "{{ charontak_repo_dir }}/"
    delete: "{{ charontak_sync_delete | bool }}"
    rsync_opts:
      - "--exclude=.git/"
      - "--exclude=.venv/"
      - "--exclude=.cursor/"
  delegate_to: localhost
  when: charontak_sync_from_controller | bool

- name: Pip install Charontak
  ansible.builtin.pip:
    name: "{{ charontak_repo_dir }}"
    editable: "{{ charontak_pip_editable }}"
    executable: pip3
    extra_args: "{{ '--break-system-packages' if charontak_pip_break_system_packages else '' }}"

- ansible.builtin.file:
    path: /usr/share/cockpit/charontak
    state: directory
    mode: "0755"

- name: cockpit-charontak static bundle
  ansible.builtin.copy:
    src: "{{ charontak_repo_dir }}/cockpit-charontak/"
    dest: /usr/share/cockpit/charontak/
    remote_src: true
    mode: "0644"

- name: Deploy /etc/charontak.ini
  ansible.builtin.template:
    src: charontak.ini.j2
    dest: /etc/charontak.ini
    mode: "0644"
  notify: Restart Charontak

- name: Install systemd unit file
  ansible.builtin.copy:
    remote_src: true
    src: "{{ charontak_repo_dir }}/systemd/charontak.service"
    dest: /etc/systemd/system/charontak.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Charontak

- name: Enable cockpit.socket
  ansible.builtin.systemd_service:
    name: cockpit.socket
    enabled: true
    state: started

- name: Enable Charontak
  ansible.builtin.systemd_service:
    name: charontak.service
    enabled: true
    daemon_reload: true
    state: started
