#
# AryaOS-style Charontak configuration.
#
# Typical AryaOS: local feeders (adsbcot, dronecot, …) publish CoT directly to
# mesh with COT_URL = udp+wo://239.2.3.1:6969. In that case disable
# [lane:local-to-mesh] and enable only [lane:mesh-to-takserver].
#
# Use [lane:local-to-mesh] only when a feeder listens for TCP connections on
# localhost (charontak connects as tcp:// client). Verify with:
#   ss -tlnp sport = :18087

[charontak]
DEBUG = false
CONNECT_RETRY_SLEEP = 5

[lane:local-to-mesh]
enabled = false
mode = forward
# Requires a TCP *listener* on this port (not an outbound feeder client).
ingress_cot_url = tcp://127.0.0.1:18087
egress_cot_url = udp+wo://239.2.3.1:6969
PYTAK_NO_HELLO = true

[lane:mesh-to-takserver]
enabled = true
mode = forward
ingress_cot_url = udp+ro://239.2.3.1:6969
egress_cot_url = tls://takserver.example.com:8089
PYTAK_NO_HELLO = true
# TLS paths / tak:// enrollment — operator fills via Cockpit Charontak
