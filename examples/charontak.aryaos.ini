#
# AryaOS-style Charontak configuration.
#
# Local feeders send CoT to charontak via UDP (udp+wo://127.0.0.1:18087 or
# udp+wo://HOST:18087). Charontak listens with udp+ro://:18087 (all interfaces)
# or udp+ro://127.0.0.1:18087 (loopback only), then relays to mesh.
#
# Feeders that already publish to mesh (udp+wo://239.2.3.1:6969) do not need
# [lane:local-to-mesh] — enable only [lane:mesh-to-takserver] in that case.

[charontak]
DEBUG = false
CONNECT_RETRY_SLEEP = 5

[lane:local-to-mesh]
enabled = true
mode = forward
# Listen for UDP CoT on port 18087 from any sender (loopback-only: udp+ro://127.0.0.1:18087)
ingress_cot_url = udp+ro://:18087
egress_cot_url = udp+wo://239.2.3.1:6969
PYTAK_NO_HELLO = true

[lane:mesh-to-takserver]
enabled = false
mode = forward
ingress_cot_url = udp+ro://239.2.3.1:6969
egress_cot_url = tls://takserver.example.com:8089
PYTAK_NO_HELLO = true
# TLS paths / tak:// enrollment — operator fills via Cockpit Charontak
