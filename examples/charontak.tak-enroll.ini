#
# Mesh + optional TCP client ingress → TAK Server enrollment (tak:// MARI URL).
# Requires: pip install 'pytak[with-aiohttp,with-crypto]'
#
# PyTAK 7.x does NOT support tcp+ppt:// (TCP listen). Use tcp:// only as outbound
# client to a feeder already listening on that port, or disable the TCP lane.

[charontak]
DEBUG = false
MAX_IN_QUEUE = 500
MAX_OUT_QUEUE = 500

[lane:mesh-to-tak]
enabled = true
mode = forward
ingress_cot_url = udp+ro://239.2.3.1:6969
egress_cot_url = tak://com.atakmap.app/enroll?host=takserver.example.com&username=USER&token=TOKEN
PYTAK_NO_HELLO = true

[lane:tcp-client-to-tak]
enabled = false
mode = forward
# Outbound connect to a CoT TCP listener (not a bind/listen):
ingress_cot_url = tcp://127.0.0.1:8087
egress_cot_url = tak://com.atakmap.app/enroll?host=takserver.example.com&username=USER&token=TOKEN
PYTAK_NO_HELLO = true
