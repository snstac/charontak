#
# Sample COTBridge configuration (copy to /etc/cotbridge.ini and edit).
#

[cotbridge]
# Global defaults inherited by each [lane:*] unless overridden there.
DEBUG = false

# Hello event on connects is disabled via PYTAK_NO_HELLO in lane sections by default.

# Max CoT queue depth per directional hop (inherits PyTAK limits if omitted).
MAX_IN_QUEUE = 500
MAX_OUT_QUEUE = 500

# Default TAK protocol payload (0 = XML, 1 = protobuf); lane can override.
# TAK_PROTO = 0

#
# Lane: multicast mesh → TAK Server (TLS CoT streaming port typical for clients)
#
[lane:mesh-to-server]
enabled = true
mode = forward
ingress_cot_url = udp://239.2.3.1:6969
egress_cot_url = tls://takserver.example.com:8089

# Typical TLS identity (paths are examples; align with PyTAK / your enrollment).
# TLS_CLIENT_CERT_PATH = /path/to/cert.pem
# TLS_CLIENT_KEY_PATH = /path/to/key.pem
# TLS_CLIENT_CA_CERT_PATH = /path/to/ca.pem
# Or PKCS#12:
# TLS_CLIENT_PFX_PATH = /path/to/client.p12
# TLS_CLIENT_PFX_PASSWORD = changeit

# Avoid PyTAK "hello" when bridging (recommended).
PYTAK_NO_HELLO = true

[lane:server-back-to-mesh]
enabled = false
mode = reverse
ingress_cot_url = udp://239.2.3.1:6969
egress_cot_url = tls://takserver.example.com:8089
PYTAK_NO_HELLO = true
