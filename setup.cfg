# Setuptools metadata for stdeb / system python3 setup.py (pyproject.toml is canonical for pip).
# Keep version in sync with pyproject.toml [project].version.

[metadata]
name = charontak
version = 0.1.5
url = https://github.com/snstac/charontak
project_urls =
    Repository = https://github.com/snstac/charontak
    Issues = https://github.com/snstac/charontak/issues
    Documentation = https://pytak.rtfd.io/
description = PyTAK CoT bridge between TAK transports (lanes / echelons)
long_description = file: README.md
long_description_content_type = text/markdown
author = Charontak contributors
license = Apache-2.0
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3

[options]
packages = find:
python_requires = >=3.9
install_requires =
    pytak>=7.0.0

[options.packages.find]
where = .
include = charontak*

[options.entry_points]
console_scripts =
    charontak = charontak.cli:main

[options.data_files]
share/cockpit/charontak =
    cockpit-charontak/manifest.json
    cockpit-charontak/index.html
    cockpit-charontak/charontak.js
share/charontak =
    packaging/charontak.ini.example

[options.extras_require]
with_takproto = pytak[with_takproto]
dev =
    pytest>=7.0
    pytest-asyncio>=0.23

[bdist_rpm]
release = 1
packager = SNSTAC Charontak <https://github.com/snstac/charontak>
doc_files =
    README.md
requires = python3
