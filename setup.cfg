# Setup configuration for COTBridge: PyTAK CoT bridge between TAK transports.
# setup.cfg mirrors snstac/pytak and snstac/adsbcot packaging layout.

[metadata]
name = cotbridge
version = file: src/cotbridge/VERSION
url = https://github.com/snstac/cotbridge
project_urls =
  CI: GitHub Actions = https://github.com/snstac/cotbridge/actions
  GitHub: issues = https://github.com/snstac/cotbridge/issues
  GitHub: repo = https://github.com/snstac/cotbridge
  Documentation = https://pytak.rtfd.io/
description = PyTAK CoT bridge between TAK transports (lanes / echelons)
long_description = file: README.md
long_description_content_type = text/markdown
author = COTBridge contributors
license = Apache-2.0
requires_python = >=3.9
classifiers =
  License :: OSI Approved :: Apache Software License
  Intended Audience :: Developers
  Programming Language :: Python
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3 :: Only
  Development Status :: 3 - Alpha
  Operating System :: POSIX
  Operating System :: MacOS :: MacOS X
  Operating System :: Microsoft :: Windows
  Operating System :: OS Independent
keywords =
  Cursor on Target
  CoT
  ATAK
  TAK
  PyTAK

[options]
packages = find:
include_package_data = True
python_requires = >=3.9, <4
package_dir =
  cotbridge = src/cotbridge
install_requires =
  pytak>=7.6.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
  cotbridge = cotbridge.cli:main

[options.data_files]
share/cotbridge =
  packaging/cotbridge.ini.example

[options.extras_require]
with_takproto = pytak[with_takproto]
dev =
  pytest>=7.0
  pytest-asyncio>=0.23
  cryptography>=39.0.0

[bdist_rpm]
release = 1
packager = SNSTAC COTBridge <https://github.com/snstac/cotbridge>
doc_files =
  README.md
requires = python3

[tool.pytest.ini_options]
testpaths = tests
asyncio_mode = auto
